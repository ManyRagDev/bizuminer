<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>BizuMiner</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <span class="mark">◆</span>
        <h1><b>Bizu</b><i>Miner</i></h1>
      </header>

      <section id="status" class="status">
        <p class="status-line"><span class="dot"></span><span id="status-text">verificando…</span></p>
        <p id="pending" class="pending" hidden></p>
      </section>

      <button id="activate" class="primary" type="button">Ativar nesta página</button>

      <section id="pairing" class="pairing" hidden>
        <p class="hint">Conecte este navegador à sua conta. Gere o código no painel do BizuMiner.</p>
        <input id="code" type="text" inputmode="text" placeholder="CÓDIGO" autocomplete="off" maxlength="8" />
        <button id="pair" class="primary" type="button">Conectar</button>
      </section>

      <footer>
        <button id="logout" class="ghost" type="button" hidden>Sair</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
